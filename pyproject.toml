# 单一配置源（G8.1）
#
# 项目级工具链（ruff / pytest）统一收口到此文件，取代散落的 .ruff.toml / pytest.ini。
# 依赖冻结仍以 requirements.lock.txt 为准（Docker / CI / README 安装指令不变）。
#
# 版本单一来源：backend/__init__.py 的 __version__（config.APP_VERSION 也读它），
# [tool.setuptools.dynamic] 从这里派生，避免 pyproject / 运行时代码两处硬编码漂移。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-rag-local"
description = "水利行业 RAG + Agent 知识问答系统（FastAPI + LangGraph + Vue3）"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Private :: Do Not Upload",
]

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]

[tool.setuptools.dynamic]
version = { attr = "backend.__version__" }

# ---------------------------------------------------------------- ruff
# Ruff lint / format 策略（CI 门禁据此执行）
# 目标：Python 3.11 风格现代化 + 常见陷阱，同时把合法惯用法白名单化。

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 在默认 F/E/W 基础上扩展：modern 注解(UP)、import 排序(I)、bugbear(B)、
# 安全(S)、时区(DTZ)、日志(G)、简化(PIE)、RUF 通用。
select = ["E", "W", "F", "I", "UP", "B", "RUF", "S", "DTZ", "G", "PIE", "BLE"]

# 项目级豁免（都有明确理由）
ignore = [
  "DTZ005",  # SQLite datetime('now') 存无时区 UTC 是本项目约定（前端按 UTC 解析，见 stores/chat.ts）
  "DTZ011",  # 同上
  "RUF001",  # 中文业务字符串必然命中"含歧义 unicode 字符"，本项目以中文为核心内容，全量豁免
  "RUF002",  # 同上：中文 docstring 全部命中
  "RUF003",  # 同上：中文注释全部命中
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",  # 测试用 assert 是标准做法（pytest 依赖 assert 收集失败信息）
  "S105",  # 测试里写硬编码测试密码是常规做法
  "S107",  # 测试辅助函数默认参数带固定测试密码是常规做法
]
"scripts/**" = [
  "S101",  # 脚本里用 assert 做前置校验（fail-fast 风格）
  "BLE001",  # 诊断/运维脚本捕获一切异常以报告 FAIL/WARN 状态，这正是脚本的目的
]
"backend/agents/**/state.py" = [
  "RUF012",  # LangGraph 状态 schema（TypedDict）的字段默认值约定：missing 时按此补全，运行期深拷贝，非共享可变对象
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯用法：Depends()/Header()/Query() 等作为函数默认参数是合法模式
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Body",
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
