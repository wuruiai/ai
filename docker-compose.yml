services:
  backend:
    build: .
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - APP_HOST=0.0.0.0
      - FRONTEND_ORIGIN=http://localhost,http://127.0.0.1
    volumes:
      - ./data:/app/data   # SQLite + Chroma + source 持久化
    restart: unless-stopped
    # 就绪探针：SQLite + Chroma 均可达才 healthy（供 depends_on service_healthy）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"   # G10.10 M8：非 root nginx 仅能监听非特权端口 8080
    depends_on:
      backend:
        condition: service_healthy   # 等后端就绪再起，避免 nginx 空转
    restart: unless-stopped
