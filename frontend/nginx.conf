server {
    # G10.10 M8 非 root：nginx 以 nginx 用户运行，只能绑定非特权端口 8080
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # G10.10 M13 加固：隐藏 nginx 版本号（避免针对特定版本的已知漏洞扫描）
    server_tokens off;

    # 安全响应头（含错误响应，always）；设置自定义缓存头的位置需各自 include
    include /etc/nginx/conf.d/security-headers.snippet;

    # gzip 压缩（文本类静态资源 + API JSON 响应，浏览器均支持）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 后端 API 反代（SSE 必须关 buffering）
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 带内容 hash 的构建产物（vite 输出在 /assets/，文件名含 hash）：
    # 强缓存 immutable——内容不变文件名不变，改版后新 hash 新 URL 天然失效
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.snippet;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存：每次拉取最新入口，保证前端版本与后端对齐（G10.9 M12）
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.snippet;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
