name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt -r requirements-dev.txt
      - name: Unit tests + coverage
        run: python -m pytest --cov=backend --cov-fail-under=70
      - name: Ruff lint（失败即阻断 PR）
        run: ruff check backend scripts tests
      - name: Ruff format（未格式化即阻断 PR）
        run: ruff format --check backend scripts tests

  security:
    name: Supply-chain security (gitleaks + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 需完整 git 历史做密钥泄漏扫描（含已删除文件）
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: gitleaks — 密钥泄漏扫描（全历史 + 工作区）
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz
          GITLEAKS_BIN=$(find . -maxdepth 2 -name 'gitleaks' -type f | head -1)
          "$GITLEAKS_BIN" detect --source . --redact --verbose
      - name: pip-audit — 生产依赖已知漏洞扫描（requirements.lock.txt）
        # 基线：G9.5 已把 7 个含已知 CVE 的锁版本升级至无漏洞版本（OSV 全量复核 0 命中）。
        # 依赖树变化时需重新审计；PYTHONUTF8=1 规避 Windows 下锁文件中文注释的 GBK 解码问题。
        run: PYTHONUTF8=1 python -m pip_audit --vulnerability-service osv -r requirements.lock.txt

  build-images:
    name: Build & push Docker images (GHCR)
    runs-on: ubuntu-latest
    # 仅本 job 需要写 GHCR 包权限
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # S2：生产 compose 依赖 ghcr.io/water-rag/* 预构建镜像，此前 CI 从不构建推送——
      # up -d 只会拉到不存在的 tag。此 job 补齐闭环。不可变 tag = 版本 + 短 sha。
      # 推送仅在 master + 配置 GHCR_PAT secret 时发生（与 smoke job 的 secret 门禁一致）；
      # 未配置时本 job 退化为「镜像能构建」的验证，保持 CI 绿。
      - name: Compute version tags
        id: ver
        run: |
          VERSION=$(sed -n 's/.*__version__ *= *"\([^"]*\)".*/\1/p' backend/__init__.py)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: ${{ secrets.GHCR_PAT != '' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.GHCR_PAT != '' }}
          tags: |
            ghcr.io/water-rag/water-rag-backend:latest
            ghcr.io/water-rag/water-rag-backend:${{ steps.ver.outputs.version }}
            ghcr.io/water-rag/water-rag-backend:${{ steps.ver.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.GHCR_PAT != '' }}
          tags: |
            ghcr.io/water-rag/water-rag-frontend:latest
            ghcr.io/water-rag/water-rag-frontend:${{ steps.ver.outputs.version }}
            ghcr.io/water-rag/water-rag-frontend:${{ steps.ver.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test (needs DashScope key)
    runs-on: ubuntu-latest
    # 仅当配置了 DashScope Key secret 时才跑（smoke 含真实 LLM/embedding 调用）
    if: ${{ secrets.DASHSCOPE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
      - name: Run smoke test
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python -m scripts.smoke_test

  frontend:
    name: Frontend (type-check + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Type check
        run: cd frontend && npm run type-check
      - name: Unit tests
        run: cd frontend && npm run test
      - name: Build
        run: cd frontend && npm run build
