# 生产部署清单（独立文件，不与开发用 docker-compose.yml 覆盖合并）
#
# 用「预构建镜像」部署，不在部署机上本地构建（CI 负责构建并推送镜像）。
# 设计要点：
#   - APP_ENV=production：配合 backend.ensure_secrets() 的 fail-fast，
#     缺失 TOKEN_SECRET / DASHSCOPE_API_KEY 时拒绝启动，防止带空密钥上线
#   - 密钥通过宿主环境变量 / .env.production 注入，绝不写进镜像
#   - REDIS_URL 留空用内存限流/预算；多实例部署时填 redis 连接串共享计数
#   - 健康检查用 /health/ready（SQLite + Chroma 就绪探针）
#   - 数据用命名卷持久化，重启/升级不丢数据
#
# 用法：
#   1. 构建并推送镜像（CI 或本地，VERSION 指定 tag，默认 latest）：
#      docker build -t ghcr.io/water-rag/water-rag-backend:${VERSION:-latest} .
#      docker build -t ghcr.io/water-rag/water-rag-frontend:${VERSION:-latest} ./frontend
#      docker push ghcr.io/water-rag/water-rag-backend:${VERSION:-latest}
#      docker push ghcr.io/water-rag/water-rag-frontend:${VERSION:-latest}
#   2. 部署机拉取并启动：
#      docker compose -f docker-compose.prod.yml pull
#      docker compose -f docker-compose.prod.yml up -d
#   3. 回滚到旧版本：换 VERSION 再 up 即可。

services:
  backend:
    image: ghcr.io/water-rag/water-rag-backend:${VERSION:-latest}
    pull_policy: always
    restart: always
    # .env.production 可选（缺失不报错）；关键密钥也可直接用宿主环境变量注入
    env_file:
      - path: .env.production
        required: false
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - FRONTEND_ORIGIN=http://localhost,http://127.0.0.1
      - REDIS_URL=${REDIS_URL:-}
      - BACKUP_ENABLED=true
      # 反代信任（G10.17）：nginx 容器在 docker 网桥（172.16/12 段）内，配置后 access 日志/
      # 登录限流才能解析到真实客户端 IP；留空则一律取直连地址（nginx 地址），更安全但不区分用户 IP。
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - water_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    image: ghcr.io/water-rag/water-rag-frontend:${VERSION:-latest}
    pull_policy: always
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"   # G10.10 M8：非 root nginx 仅能监听非特权端口 8080

  backup:
    # S4：备份调度 sidecar——backend 镜像含 scripts，循环模式每 BACKUP_INTERVAL_HOURS
    # 小时把 DB(+WAL) + chroma 备份到共享卷内 data/backups/（保留策略见 BACKUP_RETENTION_DAYS）。
    # 此前 BACKUP_ENABLED=true 但没有任何服务实际调度，up -d 后备份永不执行。
    image: ghcr.io/water-rag/water-rag-backend:${VERSION:-latest}
    pull_policy: always
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKUP_ENABLED=true
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - water_data:/app/data
    command:
      - python
      - -m
      - scripts.backup_cron
      - --interval-hours
      - "${BACKUP_INTERVAL_HOURS:-24}"

volumes:
  water_data:
